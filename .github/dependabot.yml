version: 2
updates:
  # The actions in the workflows, pinned to commit SHAs with the version in a comment. Dependabot
  # updates both; all action updates of a week come as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before Dependabot proposes them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The gem's dependencies (gemspec and Gemfile; no lockfile, as RubyGems recommends for gems).
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
