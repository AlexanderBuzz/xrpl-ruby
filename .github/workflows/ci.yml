name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        # Ruby 4.0 (stable since 2025-12) is experimental and may fail (some gems may be lagging).
        include:
          - ruby: '4.0'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems

      # Integration/network specs are tagged :integration and are excluded here.
      # To run them locally against the real Testnet: XRPL_NETWORK=1 bundle exec rspec
      - name: Run unit tests
        continue-on-error: ${{ matrix.experimental || false }}
        env:
          COVERAGE: '1'
        run: bundle exec rspec --tag '~integration'

      # Upload coverage once (from the newest stable Ruby) to avoid duplicate reports.
      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Every external action is referenced by a full commit SHA, with its version as a comment: a tag
  # can be moved to other code, a commit cannot. Dependabot keeps the SHAs current.
  pinned:
    name: Actions pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every external action is pinned to a full commit SHA
        run: |
          # The key is spelled apart, so this file does not match its own pattern.
          key=uses
          unpinned=$(grep -rnoE "${key}:\s*[^ #]+" .github/ | grep -v "${key}: \./" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a full commit SHA (owner/action@<sha> # vX.Y.Z):"
            echo "$unpinned"
            exit 1
          fi
