name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        # Ruby 4.0 (stable since 2025-12) is experimental and may fail (some gems may be lagging).
        include:
          - ruby: '4.0'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems

      # Integration/network specs are tagged :integration and are excluded here.
      # To run them locally against the real Testnet: XRPL_NETWORK=1 bundle exec rspec
      - name: Run unit tests
        continue-on-error: ${{ matrix.experimental || false }}
        env:
          COVERAGE: '1'
        run: bundle exec rspec --tag '~integration'

      # Upload coverage once (from the newest stable Ruby) to avoid duplicate reports.
      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
